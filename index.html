<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Clock</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #fff;
      --bg: #000;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      /* Prevent iOS text-size inflation and rubber-band scrolling */
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(0.5rem, 2vmin, 1.5rem);
      /* Respect iPhone notch / home indicator safe areas */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                   Consolas, "Liberation Mono", monospace;
      color: var(--fg);
      /* Block accidental text selection / long-press callouts */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      /* Let users tap to toggle format without 300ms delay */
      touch-action: manipulation;
    }

    #clock {
      font-size: clamp(3rem, 18vmin, 16rem);
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      /* Keep it from ever overflowing horizontally on narrow screens */
      max-width: 100vw;
      white-space: nowrap;
    }

    #clock .seconds {
      /* Dimmer seconds so the hour/minute dominate visually */
      opacity: 0.55;
    }

    #clock .meridiem {
      font-size: 0.28em;
      opacity: 0.7;
      margin-left: 0.15em;
      letter-spacing: 0.08em;
    }

    #date {
      font-size: clamp(0.75rem, 2.2vmin, 1.25rem);
      opacity: 0.55;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="clock" role="timer" aria-live="off">--:--:--</div>
  <div id="date"></div>

  <script>
    (function () {
      'use strict';

      const clockEl = document.getElementById('clock');
      const dateEl  = document.getElementById('date');

      // Persist user preference (12h vs 24h) across reloads.
      // Default: 24h. Tap/click the clock to toggle.
      const STORAGE_KEY = 'clock.use12h';
      let use12h = false;
      try {
        use12h = localStorage.getItem(STORAGE_KEY) === '1';
      } catch (_) { /* localStorage may be blocked (private mode) */ }

      const pad2 = (n) => (n < 10 ? '0' + n : String(n));

      function formatTime(d) {
        let h = d.getHours();
        const m = pad2(d.getMinutes());
        const s = pad2(d.getSeconds());
        let meridiem = '';

        if (use12h) {
          meridiem = h >= 12 ? 'PM' : 'AM';
          h = h % 12 || 12; // 0 -> 12
        }

        const hh = use12h ? String(h) : pad2(h);

        // Seconds and AM/PM wrapped in spans for styling
        return (
          hh + ':' + m +
          '<span class="seconds">:' + s + '</span>' +
          (meridiem ? '<span class="meridiem">' + meridiem + '</span>' : '')
        );
      }

      const DATE_FMT = new Intl.DateTimeFormat(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });

      let lastSecond = -1;

      function render() {
        const now = new Date();

        // Only touch the DOM when the second actually changes.
        // setInterval can fire slightly early/late; this keeps it idempotent.
        if (now.getSeconds() !== lastSecond) {
          lastSecond = now.getSeconds();
          clockEl.innerHTML = formatTime(now);
          dateEl.textContent = DATE_FMT.format(now);
        }

        // Align the next tick to the next wall-clock second boundary
        // so the displayed second changes exactly when it should.
        const msToNextSecond = 1000 - (Date.now() % 1000);
        setTimeout(render, msToNextSecond);
      }

      // Toggle 12h/24h on tap or click
      function toggleFormat() {
        use12h = !use12h;
        try { localStorage.setItem(STORAGE_KEY, use12h ? '1' : '0'); } catch (_) {}
        lastSecond = -1; // force immediate re-render
        render();
      }

      document.body.addEventListener('click', toggleFormat);

      // Re-render immediately when the tab becomes visible again,
      // so a backgrounded clock isn't stale for up to a second.
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          lastSecond = -1;
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
